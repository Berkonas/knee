name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: TrailBuddy-Analyzer-macOS-arm64
          - os: windows-latest
            artifact: TrailBuddy-Analyzer-Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --frozen --extra build
      - name: Download pose model to bundle
        run: uv run python -c "from trailbuddy.core.pose import model_path; model_path('full')"
      - name: PyInstaller
        run: uv run pyinstaller packaging/trailbuddy.spec --noconfirm
      - name: Smoke test built app (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/TrailBuddy Analyzer.app/Contents/MacOS/TrailBuddy Analyzer" --check-pose
      - name: Smoke test built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "dist/TrailBuddy Analyzer/TrailBuddy Analyzer.exe" --check-pose | Out-Host
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent "TrailBuddy Analyzer.app" ../${{ matrix.artifact }}.zip
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist/TrailBuddy Analyzer" -DestinationPath ${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
